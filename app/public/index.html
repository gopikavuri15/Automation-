<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a2b">
  <title>DevOps Service Monitor</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; background: #edf2ec; color: #183234; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 760px); border-top: 5px solid #d87742; padding: clamp(1.5rem, 6vw, 4rem) 0; }
    .eyebrow { color: #a24d2c; font-size: .8rem; font-weight: 750; text-transform: uppercase; }
    h1 { max-width: 12ch; margin: .8rem 0 1rem; font-family: Georgia, serif; font-size: clamp(2.5rem, 8vw, 5rem); line-height: .98; font-weight: 500; }
    p { max-width: 58ch; color: #496164; line-height: 1.7; }
    .status { display: inline-flex; align-items: center; gap: .65rem; margin-top: 1.5rem; padding: .75rem 1rem; border: 1px solid #aec5b8; background: #f8faf5; font-weight: 650; }
    .dot { width: .65rem; height: .65rem; border-radius: 50%; background: #39815c; }
    code { padding: .15rem .35rem; background: #dfe8df; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">EC2 application status</div>
    <h1>Delivery, under observation.</h1>
    <p>This service is deployed by Jenkins, served through Nginx, and monitored with Prometheus and Grafana. Its health endpoint is available at <code>/health</code>.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span><span id="service-status">Checking service...</span></div>
  </main>
  <script>
    fetch('/api/status')
      .then((response) => response.json())
      .then((status) => { document.getElementById('service-status').textContent = `${status.name}: ${status.status}`; })
      .catch(() => { document.getElementById('service-status').textContent = 'Status unavailable'; });
  </script>
</body>
</html>
